[package]
name = "nanowave-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = {version = "1.15.0", features = ["backend-linuxkms-noseat", "renderer-software", "compat-1-2"]}
anyhow = "1.0.100"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
walkdir = "2.5.0"
sea-orm = { version = "2.0.0-rc.30", features = [ "sqlx-sqlite", "macros", "runtime-tokio", "debug-print", "with-chrono", "with-json" ] }
sea-orm-migration = "2.0.0-rc.30"
tracing = "0.1.44"
chrono = "0.4.43"
file-id = "0.2.3"
lofty = "0.23.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
mp4ameta = "0.13.0"
image = "0.25.9"
evdev = "0.13.2"
debounce = "0.2.2"
sysfs_gpio = { version = "0.6.2", features = ["async-tokio"] }
futures = "0.3.31"
max170xx = "1.0.0"
linux-embedded-hal = "0.4.1"

media_source = { path = "../media_source/" }
cpal = { path = "/home/andreas/projects/sandreas/cpal" }
rodio = { path = "/home/andreas/projects/sandreas/rodio" }

# rodio = { version = "0.22.2", features = ["experimental", "playback", "wav_output"] }
# cpal = "0.18.0"
# rodio-experiments = {version="0.1.0"}

[patch.crates-io]
slint = { git = "https://github.com/sandreas/slint.git", branch="reapply-color-fix"} # use for local git (see cargo.toml)
slint-build = { git = "https://github.com/sandreas/slint.git", branch="reapply-color-fix" } # use for local git (see cargo.toml)
i-slint-core = { git = "https://github.com/sandreas/slint.git", branch="reapply-color-fix" } # use for local git (see cargo.toml)
# media_source = { path = "../media_source/" } # use for local git (see cargo.toml)
# rodio = { git = "file:///home/andreas/projects/sandreas/rodio" } # use for local git (see cargo.toml)
# rodio-experiments = { git = "file:///home/andreas/projects/sandreas/rodio-experiments" } # use for local git (see cargo.toml)
# cpal = {  git = "file:///home/andreas/projects/sandreas/cpal" } # use for local git (see cargo.toml)



[build-dependencies]
slint-build = "1.15.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
